name: Build EssentiaTD Plugins

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'ci/**'
      - 'installer/**'
      - 'CMakeLists.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'ci/**'
      - 'installer/**'
      - 'CMakeLists.txt'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ESSENTIA_REPO: https://github.com/MTG/essentia.git
  ESSENTIA_REF: f0f6c358abd133e675710ce2d5f77cc935a75eb9
  CMAKE_BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Build Essentia static library (cached across runs)
  # ---------------------------------------------------------------------------
  build-essentia:
    strategy:
      matrix:
        include:
          - os: windows-latest
            # no -G pin: windows-latest rotates VS versions (VS2022 was
            # dropped mid-2026); let CMake pick the installed VS
            cmake-gen: -A x64
          - os: macos-latest
            cmake-gen: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout EssentiaTD (for ci/essentia-CMakeLists.txt)
        uses: actions/checkout@v5
        with:
          lfs: false

      - name: Cache Essentia build
        id: cache-essentia
        uses: actions/cache@v5
        with:
          path: essentia-install
          # ci/** — must cover essentia_*.cpp/.h and essentia-patches/** too,
          # or edits to them silently reuse a stale cached Essentia build
          key: essentia-${{ runner.os }}-${{ env.ESSENTIA_REF }}-${{ hashFiles('ci/**') }}

      - name: Clone Essentia
        if: steps.cache-essentia.outputs.cache-hit != 'true'
        run: |
          git init essentia-src
          cd essentia-src
          git remote add origin ${{ env.ESSENTIA_REPO }}
          git fetch --depth 1 origin ${{ env.ESSENTIA_REF }}
          git checkout FETCH_HEAD

      - name: Overlay custom build files and patches
        if: steps.cache-essentia.outputs.cache-hit != 'true'
        run: |
          cp ci/essentia-CMakeLists.txt essentia-src/CMakeLists.txt
          cp ci/essentia_algorithms_reg.cpp essentia-src/src/essentia_algorithms_reg.cpp
          cp ci/essentia_version.h essentia-src/src/version.h
          cp -r ci/essentia-patches/essentia/* essentia-src/src/essentia/

      - name: Build Essentia
        if: steps.cache-essentia.outputs.cache-hit != 'true'
        working-directory: essentia-src
        run: |
          # -DCMAKE_BUILD_TYPE is required for the macOS single-config
          # generator; --config Release alone is ignored there
          cmake -B build ${{ matrix.cmake-gen }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          cmake --install build --prefix ../essentia-install

      - name: Upload Essentia artifact
        uses: actions/upload-artifact@v5
        with:
          name: essentia-${{ runner.os }}
          path: essentia-install

  # ---------------------------------------------------------------------------
  # Stage 2: Build the 5 CHOP plugins
  # ---------------------------------------------------------------------------
  build-plugins:
    needs: build-essentia
    strategy:
      matrix:
        include:
          - os: windows-latest
            # no -G pin: windows-latest rotates VS versions (VS2022 was
            # dropped mid-2026); let CMake pick the installed VS
            cmake-gen: -A x64
            artifact-name: EssentiaTD-Windows
          - os: macos-latest
            cmake-gen: ""
            artifact-name: EssentiaTD-macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout EssentiaTD
        uses: actions/checkout@v5
        with:
          lfs: false

      - name: Download Essentia build
        uses: actions/download-artifact@v5
        with:
          name: essentia-${{ runner.os }}
          path: essentia-install

      - name: Install Essentia into vendor tree
        run: |
          rm -rf src/vendor/essentia/include src/vendor/essentia/lib
          mkdir -p src/vendor/essentia
          cp -r essentia-install/include src/vendor/essentia/
          cp -r essentia-install/lib src/vendor/essentia/

      - name: Build plugins
        working-directory: src
        run: |
          cmake -B build ${{ matrix.cmake-gen }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Collect and sign plugins
        run: |
          mkdir -p plugins
          if [ "$RUNNER_OS" = "Windows" ]; then
            find src/build -name "*.dll" | while read f; do cp "$f" plugins/; done
          elif [ "$RUNNER_OS" = "macOS" ]; then
            find src/build -name "*.plugin" -type d | while read d; do cp -R "$d" plugins/; done
            for p in plugins/*.plugin; do codesign --force --sign - "$p"; done
          fi
          ls -la plugins/

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: plugins/

      - name: Compute installer version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # Inno Setup ships preinstalled on windows-latest (ISCC in PATH).
      # pwsh instead of bash: bash's MSYS path mangling corrupts /D... switches
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          iscc "/DAppVersion=${{ steps.ver.outputs.version }}"
          "/DPluginDir=$env:GITHUB_WORKSPACE\plugins"
          "/DOutputDir=$env:GITHUB_WORKSPACE\installer-out"
          installer\windows\EssentiaTD.iss

      - name: Build macOS installer (pkg)
        if: runner.os == 'macOS'
        run: bash installer/macos/build-pkg.sh "${{ steps.ver.outputs.version }}" plugins installer-out

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}-Installer
          path: installer-out/

  # ---------------------------------------------------------------------------
  # Stage 3: Create GitHub Release (tag pushes only)
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-plugins
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows plugins
        uses: actions/download-artifact@v5
        with:
          name: EssentiaTD-Windows
          path: EssentiaTD-Windows

      - name: Download macOS plugins
        uses: actions/download-artifact@v5
        with:
          name: EssentiaTD-macOS
          path: EssentiaTD-macOS

      - name: Download Windows installer
        uses: actions/download-artifact@v5
        with:
          name: EssentiaTD-Windows-Installer
          path: installers

      - name: Download macOS installer
        uses: actions/download-artifact@v5
        with:
          name: EssentiaTD-macOS-Installer
          path: installers

      - name: Package releases
        run: |
          cd EssentiaTD-Windows && zip -r ../EssentiaTD-Windows.zip . && cd ..
          cd EssentiaTD-macOS && zip -r ../EssentiaTD-macOS.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EssentiaTD-Windows.zip
            EssentiaTD-macOS.zip
            installers/*.exe
            installers/*.pkg
          generate_release_notes: true
